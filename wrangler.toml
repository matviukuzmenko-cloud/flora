name = "flora-anotomy-ai"
main = "worker.js"
compatibility_date = "2026-10-27"

[vars]
SITE_ORIGIN = "https://flora-anotomy.work.gd"
SUPABASE_URL = "https://YOUR-PROJECT.supabase.co"
VAPID_PUBLIC_KEY = ""
VAPID_SUBJECT = "mailto:admin@example.com"

[triggers]
crons = ["0 9 * * *"]

[[ratelimits]]
name = "CHAT_RATE_LIMITER"
namespace_id = "1001"
simple = { limit = 12, period = 60 }

[[ratelimits]]
name = "DIAGNOSIS_RATE_LIMITER"
namespace_id = "1002"
simple = { limit = 3, period = 60 }
